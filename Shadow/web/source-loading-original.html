  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050c11; color: #e8f4f5; font-family: "ManusCC0", "ManusCC0 Sans CJK SC", sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; isolation: isolate; overflow: auto; background: #050c11; display: flex; align-items: center; padding: max(36px, env(safe-area-inset-top)) max(7.5vw, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(7.5vw, env(safe-area-inset-left)); }
    #loading[hidden], [hidden] { display: none !important; }
    .loading-art { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 65% center; z-index: -3; }
    #loading::before { content: ""; position: fixed; inset: 0; z-index: -2; background: linear-gradient(90deg, rgba(2,8,13,.94), rgba(3,10,16,.75) 32%, rgba(3,10,16,.12) 70%), linear-gradient(0deg, rgba(3,10,16,.9), transparent 35%); }
    #loading::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .13; background: repeating-linear-gradient(0deg, transparent 0 3px, #06141c 3px 4px); }
    .loading-copy { width: min(430px, 44vw); border-left: 2px solid #53d6e7; padding-left: clamp(20px, 2.5vw, 40px); }
    p { margin: 0; }
    .mission-tag { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .17em; line-height: 1.6; color: #a6c6cc; }
    .mission-tag::before { content: ""; width: 5px; height: 5px; background: #6eedf4; box-shadow: 0 0 12px #29c9e7; flex: none; }
    h1 { margin: 25px 0 16px; font-weight: 400; font-size: clamp(72px, 9.5vw, 140px); letter-spacing: -.055em; line-height: 1.02; color: #edffff; text-shadow: 5px 4px 0 #164451; }
    .tagline { color: #bed4d9; font-size: clamp(13px, 1.3vw, 17px); line-height: 1.7; letter-spacing: .04em; }
    .load-block { margin-top: clamp(34px, 5.5vh, 64px); }
    .load-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 13px; font-size: 11px; line-height: 1.5; letter-spacing: .05em; }
    #loading-phase { color: #81a8b1; }
    #loading-status { color: #dcfbff; text-align: right; font-variant-numeric: tabular-nums; max-width: 72%; }
    progress { appearance: none; display: block; border: 0; border-radius: 0; width: 100%; height: 3px; overflow: hidden; background: #23333e; accent-color: #68edf4; }
    progress::-webkit-progress-bar { background: #23333e; }
    progress::-webkit-progress-value { background: linear-gradient(90deg, #147d97, #7cf5fc); box-shadow: 0 0 15px #2bd7ed; transition: width .15s ease-out; }
    progress::-moz-progress-bar { background: #68edf4; }
    progress:indeterminate { background: linear-gradient(90deg, #23333e 30%, #68edf4 50%, #23333e 70%); background-size: 220% 100%; animation: searching 1.8s linear infinite; }
    .gameplay-hint { color: #72949c; font-size: 10px; letter-spacing: .15em; line-height: 1.7; margin-top: 20px; }
    #loading-notice { margin-top: 17px; color: #d5e9ec; font-size: 12px; line-height: 1.65; }
    #loading-retry { margin-top: 18px; border: 1px solid #58c7d8; background: #091d29; color: #d8faff; padding: 11px 22px; cursor: pointer; font: inherit; font-size: 12px; }
    #loading-retry:hover { background: #113b49; }
    #loading-retry:focus-visible { outline: 2px solid #d6fcff; outline-offset: 4px; }
    noscript { display: block; margin-top: 20px; font-size: 12px; line-height: 1.6; }
    .loading-signature { position: fixed; right: max(32px, env(safe-area-inset-right)); bottom: max(25px, env(safe-area-inset-bottom)); color: #82a2aa; font-size: 10px; letter-spacing: .28em; }
    @keyframes searching { from { background-position: 130% 0; } to { background-position: -90% 0; } }
    @media (max-aspect-ratio: 3/4) {
      #loading { align-items: flex-end; padding: 30px 28px max(48px, env(safe-area-inset-bottom)); }
      .loading-art { height: 58%; object-fit: contain; object-position: center top; }
      #loading::before { background: linear-gradient(0deg, #050c11 38%, rgba(5,12,17,.96) 47%, transparent 75%); }
      .loading-copy { width: 100%; max-width: 480px; padding-left: 22px; }
      h1 { font-size: clamp(64px, 18vw, 100px); margin-top: 18px; }
      .load-block { margin-top: 28px; }
      .loading-signature { right: 28px; bottom: 16px; }
    }
    @media (max-height: 480px) {
      #loading { padding: 20px 5vw; }
      .loading-copy { width: min(430px, 52vw); padding-left: 20px; }
      h1 { font-size: 64px; margin: 12px 0; }
      .load-block { margin-top: 20px; }
      .gameplay-hint { margin-top: 12px; }
      .loading-signature { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { progress:indeterminate { animation: none; } progress::-webkit-progress-value { transition: none; } }
  </style>
</head>

      retry.textContent = zh ? '重试' : 'Retry';
      progress.setAttribute('aria-label', zh ? '下载进度' : 'Download progress');
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      const startedAt = performance.now();
      let lastProgressAt = startedAt;
      let downloadedBytes = 0;
      let downloadComplete = false;
      const updateNotice = () => {
        if (failed || ready || performance.now() - startedAt < 30000) return;
        notice.hidden = false;
        retry.hidden = false;
        const message = performance.now() - lastProgressAt >= 30000
          ? (zh ? '暂未看到新的加载进度。可以继续等待，或重试。' : 'No recent loading progress. You can keep waiting or retry.')
          : (zh ? '仍在加载。可以继续等待，或重试。' : 'Still loading. You can keep waiting or retry.');
        if (notice.textContent !== message) notice.textContent = message;
      };
      const onWindowError = (event) => fail(event.error || new Error('Engine startup error'));
      const onUnhandledRejection = (event) => fail(event.reason || new Error('Engine startup rejected'));
      // Time alone cannot prove failure: downloads and WASM compilation may be slow.
      const startupWatch = setInterval(updateNotice, 1000);
      const stopObserving = () => {
        clearInterval(startupWatch);
        window.removeEventListener('error', onWindowError);
        window.removeEventListener('unhandledrejection', onUnhandledRejection);
      };
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error('[game-loading] Startup failed', error);
        loading.hidden = false;
        status.textContent = zh ? '游戏加载失败，请重试。' : 'Unable to load the game. Please retry.';
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      };
      // Some Godot bootstrap promises do not forward download/compile failures.
      window.addEventListener('error', onWindowError);
      window.addEventListener('unhandledrejection', onUnhandledRejection);
      const onProgress = (current, total) => {
        if (failed || ready) return;
        // Repeated/unknown totals do not renew liveness; growing byte counts do.
        if (Number.isFinite(current) && current > downloadedBytes) {
          downloadedBytes = current;
          lastProgressAt = performance.now();
        }
        if (!downloadComplete && Number.isFinite(total) && total > 0 && Number.isFinite(current) && current >= total) {
          downloadComplete = true;
          lastProgressAt = performance.now();
        }
        updateNotice();
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute('value');
          status.textContent = zh ? '正在加载…' : 'Loading…';
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total
          ? (zh ? '正在启动游戏…' : 'Starting game…')
          : `${Math.floor(current / total * 100)}%`;
      };
      const start = async () => {
        if (failed) return;
        try {
          lastProgressAt = performance.now();
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          // Download completion alone is not engine readiness.
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (failed) return;
            loading.hidden = true;
            if (config['focusCanvas']) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once: true });
      script.addEventListener('error', () => fail(new Error('Engine script could not be loaded')), { once: true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
